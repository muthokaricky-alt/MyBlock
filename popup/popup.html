<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px system-ui, sans-serif; width: 260px; margin: 0; padding: 14px; }
    header { display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 15px; margin: 0; }
    #host { color: #666; margin: 6px 0 10px; word-break: break-all; }
    button { width: 100%; padding: 9px; font-size: 14px; border: 0; border-radius: 6px; cursor: pointer; margin-top: 8px; }
    button:disabled { opacity: .45; cursor: default; }
    #pause { background: #d32f2f; color: #fff; }
    #pause.paused { background: #2e7d32; }
    #pick { background: #eee; color: #222; }
    #status, #stats { margin-top: 10px; color: #444; }
    #settings { background: none; color: #555; font-size: 12px; text-decoration: underline; width: auto; padding: 0; margin-top: 12px; }
    .sw { position: relative; width: 38px; height: 22px; display: inline-block; }
    .sw input { opacity: 0; width: 0; height: 0; }
    .sw span { position: absolute; inset: 0; background: #bbb; border-radius: 22px; transition: .2s; cursor: pointer; }
    .sw span:before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
    .sw input:checked + span { background: #d32f2f; }
    .sw input:checked + span:before { transform: translateX(16px); }
  </style>
</head>
<body>
  <header>
    <h1>MyBlock</h1>
    <label class="sw" title="Turn MyBlock on or off everywhere"><input type="checkbox" id="power"><span></span></label>
  </header>
  <div id="host">...</div>
  <button id="pause">...</button>
  <button id="pick">Pick an element to hide</button>
  <div id="stats"></div>
  <div id="status"></div>
  <button id="settings">Settings and custom filters</button>
  <script src="popup.js"></script>
</body>
</html>
