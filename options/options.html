<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MyBlock settings</title>
  <style>
    body { font: 15px system-ui, sans-serif; max-width: 760px; margin: 32px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 22px; } h2 { font-size: 17px; margin-top: 32px; }
    textarea { width: 100%; box-sizing: border-box; height: 260px; font: 13px monospace; }
    button { padding: 8px 14px; border: 0; border-radius: 6px; background: #d32f2f; color: #fff; cursor: pointer; font-size: 14px; }
    button.small { padding: 3px 8px; font-size: 12px; background: #eee; color: #222; margin-left: 8px; }
    #msg { margin-left: 10px; } .err { color: #b00020; }
    pre { background: #f5f5f5; padding: 10px; overflow: auto; max-height: 180px; font-size: 12px; }
    code { background: #f0f0f0; padding: 1px 4px; border-radius: 3px; }
    li { margin: 4px 0; font-family: monospace; font-size: 13px; }
  </style>
</head>
<body>
  <h1>MyBlock settings</h1>

  <h2>Custom filters</h2>
  <p>Adblock Plus syntax, one per line. Examples:
    <code>||ads.example.com^</code>, <code>@@||example.com^$script</code>, <code>example.com##.sidebar-ad</code>.
    These apply on top of the built-in list and take effect on save.</p>
  <textarea id="filters" spellcheck="false" placeholder="! my filters"></textarea>
  <p><button id="save">Save filters</button><span id="msg"></span></p>
  <pre id="skipped" hidden></pre>

  <h2>Elements you hid with the picker</h2>
  <div id="picked"></div>

  <script src="../lib/abp.js"></script>
  <script src="options.js"></script>
</body>
</html>
